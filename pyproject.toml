[project]
name = "price-parser"
version = "0.1.0"
description = "Парсер каталога с выгрузкой в Excel и отслеживанием цен"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
]

[project.scripts]
price-parser = "price_parser:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
